name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:win
      - name: Build installer and portable ZIP
        run: python scripts/build-releases.py --runtime dist/Markpad-win32-x64
      - name: Parse Windows setup and publisher scripts
        shell: powershell
        run: |
          $scripts = @('installer/setup.ps1','scripts/Publish-Markpad.ps1')
          foreach ($file in $scripts) {
            $text = (Get-Content $file -Raw).Replace('@@VERSION@@','0.1.4').Replace('@@UNINSTALL@@','$false').Replace('@@PAYLOAD_SHA256@@','')
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Markpad-Windows-release
          path: dist/releases/*
          if-no-files-found: error
